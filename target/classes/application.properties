spring.application.name=tia-zoca
spring.profiles.default=dev
server.port=${PORT:${SERVER_PORT:8080}}
server.forward-headers-strategy=framework
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.error.include-message=never
server.error.include-stacktrace=never
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.flyway.enabled=true
spring.sql.init.mode=never
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
app.secretary.email=${SECRETARY_EMAIL:}
app.secretary.password=${SECRETARY_PASSWORD:}
app.secretary.name=${SECRETARY_NAME:Secretaria}
app.time-zone=America/Sao_Paulo
